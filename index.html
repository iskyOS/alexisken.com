<body class="home">

	<nav class="home-nav" aria-label="Main">

	<p class="meta">NYC / Product &amp; Code / <span id="year">2026</span></p>

	<div class="home-hero">
		<h1 class="title"><a class="titlelink" href="/">Alex</a></h1>
		<p class="sub">Product marketing &amp;<br> technology</p>
	</div>

	<script>
	document.getElementById('year').textContent = new Date().getFullYear();

	// Click "mail" to copy the address; falls back to the mailto: link
	// when the clipboard API is unavailable.
	const copyEmail = document.getElementById('copy-email');
	copyEmail.addEventListener('click', function (e) {
		if (!navigator.clipboard) return;
		e.preventDefault();
		navigator.clipboard.writeText('alexander.isken@gmail.com').then(() => {
			this.textContent = 'address copied';
			setTimeout(() => { this.textContent = 'mail'; }, 1200);
		});
	});
	</script>
